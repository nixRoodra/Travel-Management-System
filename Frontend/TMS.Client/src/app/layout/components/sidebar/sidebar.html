<div class="sidebar-container">
  <div class="brand-header">
    <div class="brand-mark" aria-hidden="true">
      <mat-icon>flight</mat-icon>
    </div>
    <div class="brand-text">
      <span class="brand-name">TMS Portal</span>
      <span class="brand-subtitle">Corporate Travel</span>
    </div>
  </div>

  <mat-divider />

  <nav class="nav-scroll" aria-label="Main navigation">
    @for (section of visibleSections(); track section.title) {
      <div class="nav-section">
        <div class="nav-section-title">{{ section.title }}</div>
        <mat-nav-list>
          @for (item of section.items; track item.route) {
            <a
              mat-list-item
              [routerLink]="item.route"
              routerLinkActive="active-nav-item"
              (click)="onNavigate()"
            >
              <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          }
        </mat-nav-list>
      </div>
    }
  </nav>
</div>
